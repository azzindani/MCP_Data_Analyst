# ─────────────────────────────────────────────────────────────────────────────
# mcp-data-analyst — local & VPS-friendly compose stack.
#
# One image (see Dockerfile), one service per active sub-server, selected via
# SERVER_MODULE. data_advanced (retired, zero tools) and data_project
# (redirect alias of data_workspace) are intentionally not deployed here.
# All services share one bearer-auth token set (DA_TOKENS_FILE / DA_TOKENS /
# DA_API_KEY) since they're one logical deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8810/health   # data_basic
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
x-da-common: &da-common
  build:
    context: .
  image: ${DA_IMAGE:-mcp-data-analyst:latest}
  restart: unless-stopped
  environment: &da-common-env
    DA_TOKENS_FILE: ${DA_TOKENS_FILE:-}
    DA_TOKENS: ${DA_TOKENS:-}
    DA_API_KEY: ${DA_API_KEY:-}
    MCP_CONSTRAINED_MODE: ${MCP_CONSTRAINED_MODE:-0}
  mem_limit: ${DA_MEM_LIMIT:-2g}
  volumes:
    - ./tokens.json:/home/app/tokens.json:ro

services:
  data-basic:
    <<: *da-common
    container_name: mcp-data-basic
    ports: ["${DA_BASIC_HOST_PORT:-8810}:8810"]
    environment:
      <<: *da-common-env
      SERVER_MODULE: servers/data_basic/server.py
      DA_BASIC_TRANSPORT: http
      DA_BASIC_HOST: 0.0.0.0
      DA_BASIC_PORT: 8810
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['DA_BASIC_PORT']+'/health',timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  data-medium:
    <<: *da-common
    container_name: mcp-data-medium
    ports: ["${DA_MEDIUM_HOST_PORT:-8811}:8811"]
