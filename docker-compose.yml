# ─────────────────────────────────────────────────────────────────────────────
# mcp-data-analyst — local & VPS-friendly compose stack.
#
# One image, ONE container: unified_server.py mounts all 7 active
# sub-servers as separate MCP endpoints on one port, so pandas/numpy/scipy/
# matplotlib load once instead of seven times. data_advanced (retired, zero
# tools) and data_project (redirect alias of data_workspace) are
# intentionally not deployed. All 7 share one bearer-auth token set
# (DA_TOKENS_FILE / DA_TOKENS / DA_API_KEY) since they're one logical
# deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8810/health            # aggregate
#   curl http://localhost:8810/basic/health       # per sub-server
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  data-analyst:
    build:
      context: .
    image: ${DA_IMAGE:-mcp-data-analyst:latest}
    container_name: mcp-data-analyst
    restart: unless-stopped
    ports:
      - "${DA_HOST_PORT:-8810}:8810"
    environment:
      DA_HOST: 0.0.0.0
      DA_PORT: 8810
      DA_TOKENS_FILE: ${DA_TOKENS_FILE:-}
      DA_TOKENS: ${DA_TOKENS:-}
      DA_API_KEY: ${DA_API_KEY:-}
      MCP_CONSTRAINED_MODE: ${MCP_CONSTRAINED_MODE:-0}
      # OAuth 2.0 bridge for clients that require it (e.g. claude.ai's Custom
      # Connector) instead of a plain bearer header — see shared/oauth_bridge.py.
      # One state dir per sub-server (each is its own claude.ai connector, at
      # its own /basic, /medium, ... path) even though it's one process/port.
      # Only takes effect when a token source above is set; harmless otherwise.
      DA_BASIC_OAUTH_STATE_DIR: /home/app/.oauth-state/basic
      DA_MEDIUM_OAUTH_STATE_DIR: /home/app/.oauth-state/medium
      DA_STATISTICS_OAUTH_STATE_DIR: /home/app/.oauth-state/statistics
      DA_TRANSFORM_OAUTH_STATE_DIR: /home/app/.oauth-state/transform
      DA_VISUAL_OAUTH_STATE_DIR: /home/app/.oauth-state/visual
      DA_WORKSPACE_OAUTH_STATE_DIR: /home/app/.oauth-state/workspace
      DA_INGEST_OAUTH_STATE_DIR: /home/app/.oauth-state/ingest
      DA_OAUTH_CLIENT_ID: ${DA_OAUTH_CLIENT_ID:-}
      DA_OAUTH_CLIENT_SECRET: ${DA_OAUTH_CLIENT_SECRET:-}
    mem_limit: ${DA_MEM_LIMIT:-1g}
    volumes:
      - ./tokens.json:/home/app/tokens.json:ro
      # Persists OAuth-issued access/refresh tokens (one subdir per
      # sub-server) so a container restart doesn't force claude.ai to
      # reauthorize. `mkdir -p oauth-state && chown 999:999 oauth-state`
      # before first run — left root-owned, the container's non-root user
      # can't write to it.
      - ./oauth-state:/home/app/.oauth-state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8810/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
