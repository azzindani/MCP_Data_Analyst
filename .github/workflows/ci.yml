name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Cross-platform test matrix ──────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      # ── Linting & static analysis ──
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright servers/ shared/

      - name: Verify tool docstrings
        run: uv run python tests/verify_tool_docstrings.py

      - name: Verify output path priority
        run: uv run python tests/verify_output_paths.py

      # ── Tests ──
      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short

  # ── Constrained mode (8 GB VRAM target) ─────────────────────────────
  constrained:
    name: Constrained mode (ubuntu)
    runs-on: ubuntu-22.04

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests in constrained mode
        run: uv run python -m pytest tests/ -q --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-data-analyst
          push: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The suite above never starts a server (STANDARDS.md keeps pytest offline)
  # and the docker job never runs the image it builds, so nothing until now
  # proved that what we ship answers a request. Shared action, because this is
  # identical in all six repos and drift between copies is the bug that keeps
  # costing rounds.
  e2e:
    name: End-to-end (container)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test every tool over HTTP
        uses: azzindani/MCP_Math/.github/actions/e2e-smoke@main
        with:
          port: "8810"
          key-env: DA_API_KEY
          # Deliberately not the deployed hostname. Rebinding protection is off,
          # so any Host must be accepted; an arbitrary one proves exactly that
          # and keeps the real domain out of one more file.
          public-host: data.example.com
          mcp-path: /basic/mcp
          health-timeout: "180"
          create-dirs: "oauth-state"
          shared-dir: shared-files
